# Local stack: PostgreSQL, the API and the Angular app behind nginx.
# Start with:  docker compose up --build
# Settings come from .env (copy .env.example; .env is git-ignored).

name: log-analyzer

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: loganalyzer
      POSTGRES_USER: loganalyzer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example to .env)}
    volumes:
      # PostgreSQL 18+ images keep their data under /var/lib/postgresql (no longer .../data).
      - postgres-data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # --host forces a TCP check: during first-run initialization the server only listens on its Unix socket.
      test: ["CMD-SHELL", "pg_isready --host=127.0.0.1 --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: src/LogAnalyzer.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=loganalyzer;Username=loganalyzer;Password=${POSTGRES_PASSWORD}"
      # StandIn (no key, no network) unless .env says Claude.
      Model__Provider: ${MODEL_PROVIDER:-StandIn}
    # The API key reaches the API as a file in /run/secrets, so it stays out of docker inspect.
    secrets:
      - Model__Claude__ApiKey
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-5080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: src/web
    depends_on:
      api:
        condition: service_healthy
        # nginx resolves the api hostname once at startup: restart web whenever api is recreated.
        restart: true
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:

secrets:
  # Read from ANTHROPIC_API_KEY in .env or the shell; empty when it is not set, which the stand-in never reads.
  Model__Claude__ApiKey:
    environment: ANTHROPIC_API_KEY
