name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  OPENSPEC_VERSION: 1.14.1
  NODE_VERSION: 24

jobs:
  specs:
    name: Specs and scenario coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the OpenSpec CLI
        run: npm install --global @fission-ai/openspec@${{ env.OPENSPEC_VERSION }}

      - name: Validate the spec-tdd workflow schema
        run: openspec schema validate spec-tdd

      - name: Validate specs and active changes
        run: openspec validate --all --strict --no-interactive

      - name: Check that archived changes have no unfinished tasks
        run: openspec validate --archived --no-interactive

      - name: Test the coverage check
        run: node --test scripts/check-scenario-coverage.test.mjs

      - name: Check scenario coverage
        run: node scripts/check-scenario-coverage.mjs

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore LogAnalyzer.slnx

      # CI=true makes Directory.Build.props treat warnings as errors.
      - name: Build
        run: dotnet build LogAnalyzer.slnx --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/LogAnalyzer.UnitTests/LogAnalyzer.UnitTests.csproj --configuration Release --no-build

      # Testcontainers starts PostgreSQL with the runner's Docker engine.
      - name: Integration tests
        run: dotnet test tests/LogAnalyzer.IntegrationTests/LogAnalyzer.IntegrationTests.csproj --configuration Release --no-build

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Production build
        run: npm run build

  stack:
    name: Docker Compose stack
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Create .env from the example
        run: cp .env.example .env

      - name: Build and start the stack, waiting until every service is healthy
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: API health through nginx
        run: curl --fail --silent --show-error http://localhost:8080/api/health

      - name: Show container logs
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
