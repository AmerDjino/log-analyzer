# Serves the Angular build and forwards /api to the API container, so the browser sees a single origin.
# nginx-unprivileged listens on 8080 and runs as a non-root user.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API: strip the /api prefix, so /api/health reaches the API's /health.
    # ^~ keeps the regex location below from capturing API paths that end in .js or .css.
    location ^~ /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Above the 10 MB submission limit specified for log-ingestion (add-api-skeleton), so oversized
        # uploads get the API's own INPUT_TOO_LARGE error instead of an nginx error page. Raise both together.
        client_max_body_size 12m;
    }

    # Scripts, styles and fonts carry a content hash in their file names (outputHashing: all),
    # so they can be cached for a long time. Files from public/ keep their names and are not matched here.
    location ~* \.(?:js|css|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes: anything that is not a file is served by the Angular app.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
